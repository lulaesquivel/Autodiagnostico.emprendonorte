<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Autodiagnóstico - Emprendo Norte</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f7f5f2;
    margin: 0;
    padding: 0 0 40px 0;
    color: #2b2b2b;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

  header {
    text-align: center;
    padding: 20px 16px 12px 16px;
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
    color: #2b2b2b;
  }
  header p {
    font-size: 13px;
    color: #777;
    margin: 0;
  }

  .field-group { margin-bottom: 18px; }
  .field-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #444;
  }
  .field-group input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
  }

  .progress-bar {
    position: sticky;
    top: 0;
    background: #f7f5f2;
    padding: 10px 0;
    z-index: 5;
    font-size: 12px;
    color: #666;
    text-align: center;
  }
  .progress-track {
    height: 6px;
    background: #e5e0da;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: #c0562e;
    width: 0%;
    transition: width 0.25s ease;
  }

  .question-card {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    border-left: 5px solid #ccc;
  }
  .question-card.duro { border-left-color: #c0562e; }
  .question-card.blando { border-left-color: #3f6b57; }

  .q-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .q-tag.duro { background: #f3d9c9; color: #8a3d1c; }
  .q-tag.blando { background: #d9e6de; color: #2c4b3a; }

  .question-card h3 {
    font-size: 16px;
    margin: 0 0 12px 0;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid #e5e0da;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 13.5px;
    line-height: 1.4;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .option:active { transform: scale(0.98); }
  .option .bullet {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #ccc;
    margin-top: 1px;
    position: relative;
  }
  .option.selected {
    border-color: #c0562e;
    background: #fdf3ee;
  }
  .question-card.blando .option.selected {
    border-color: #3f6b57;
    background: #f0f5f2;
  }
  .option.selected .bullet { border-color: #c0562e; }
  .question-card.blando .option.selected .bullet { border-color: #3f6b57; }
  .option.selected .bullet::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #c0562e;
  }
  .question-card.blando .option.selected .bullet::after { background: #3f6b57; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #2b2b2b;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .submit-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-top: 8px;
  }

  /* results */
  #results { display: none; }
  .result-card {
    background: #fff;
    border-radius: 18px;
    padding: 24px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    text-align: center;
  }
  .result-card .brand {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #999;
    margin-bottom: 4px;
  }
  .result-card .participant-name {
    font-size: 15px;
    font-weight: 700;
    color: #2b2b2b;
    margin-bottom: 16px;
  }
  .profile-title {
    font-size: 20px;
    font-weight: 800;
    color: #c0562e;
    margin: 4px 0 6px 0;
  }
  .profile-desc {
    font-size: 13.5px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  canvas#radarChart { max-width: 100%; margin: 8px 0 18px 0; }
  #mountainSvg { width: 100%; height: auto; display: block; margin: 4px 0 10px 0; }
  .area-label { font-size: 12.5px; fill: #333; font-weight: 700; }
  .level-value { font-size: 11px; fill: #fff; font-weight: 700; }
  .meta-label { font-size: 11px; fill: #8a6a3a; font-weight: 700; }
  .todo-box {
    text-align: left;
    background: #f7f5f2;
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 4px;
  }
  .todo-box h4 {
    margin: 0 0 8px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #444;
  }
  .todo-box ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
    color: #444;
    line-height: 1.6;
  }
  .legend-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 11px;
    color: #666;
    margin-top: -6px;
    margin-bottom: 10px;
  }
  .legend-row span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .reset-btn {
    width: 100%;
    padding: 14px;
    border: 1.5px solid #ddd;
    border-radius: 12px;
    background: #fff;
    color: #444;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
  }
  .screenshot-tip {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div id="quiz">
    <header>
      <h1>Autodiagnóstico</h1>
      <p>Encuentro 1 — Emprendo Norte</p>
    </header>

    <div class="progress-bar">
      <span id="progressText">0 de 6 respondidas</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="field-group">
      <label>Nombre</label>
      <input type="text" id="participantName" placeholder="Escribí tu nombre">
    </div>

    <div id="questionsContainer"></div>

    <button class="submit-btn" id="submitBtn" disabled>Ver mi resultado</button>
    <p class="hint">Respondé las 6 áreas para ver tu gráfico y tu perfil</p>
  </div>

  <div id="results">
    <div class="result-card">
      <div class="brand">Emprendo Norte</div>
      <div class="participant-name" id="resultName">—</div>

      <svg id="mountainSvg" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fdf3e7"/>
            <stop offset="100%" stop-color="#f7f5f2"/>
          </linearGradient>
          <linearGradient id="slopeFill" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d98a5f"/>
            <stop offset="55%" stop-color="#bfae6e"/>
            <stop offset="100%" stop-color="#5e8f6f"/>
          </linearGradient>
          <linearGradient id="ridgeLine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#c0562e"/>
            <stop offset="100%" stop-color="#3f6b57"/>
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="800" height="480" fill="url(#sky)"/>
        <circle cx="710" cy="70" r="34" fill="#f7d896"/>
        <g fill="#ffffff" opacity="0.8">
          <ellipse cx="130" cy="70" rx="34" ry="14"/>
          <ellipse cx="158" cy="62" rx="24" ry="12"/>
          <ellipse cx="430" cy="50" rx="28" ry="11"/>
          <ellipse cx="452" cy="44" rx="18" ry="9"/>
        </g>
        <polygon points="0,240 90,140 180,240" fill="#e4dfd6" opacity="0.9"/>
        <polygon points="120,240 230,120 340,240" fill="#ded6c8" opacity="0.9"/>
        <polygon points="480,240 590,150 700,240" fill="#e4dfd6" opacity="0.9"/>
        <polygon points="620,240 720,160 800,240" fill="#ded6c8" opacity="0.9"/>

        <line x1="50" y1="100" x2="750" y2="100" stroke="#e2c48a" stroke-width="2" stroke-dasharray="5,6"/>
        <text x="52" y="92" class="meta-label">Meta: negocio consolidado</text>
        <line x1="50" y1="170" x2="750" y2="170" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
        <line x1="50" y1="240" x2="750" y2="240" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
        <line x1="50" y1="310" x2="750" y2="310" stroke="#ffffff" stroke-width="1" opacity="0.35"/>

        <polygon id="fillArea" fill="url(#slopeFill)" points=""/>
        <polyline id="ridgeTop" fill="none" stroke="url(#ridgeLine)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points=""/>
        <polyline id="trail" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="6,7" stroke-linecap="round" points="">
          <animate id="trailAnim" attributeName="stroke-dashoffset" begin="indefinite" fill="freeze" dur="2.6s" from="0" to="0"/>
        </polyline>

        <g id="flags"></g>
        <g id="areaLabels"></g>

        <g id="climber">
          <g id="climberBob">
            <ellipse cx="0" cy="14" rx="10" ry="4" fill="#00000022"/>
            <rect x="-6" y="-8" width="12" height="16" rx="4" fill="#3b4a63"/>
            <circle cx="0" cy="-16" r="7" fill="#e8b98c"/>
            <path d="M -8 -21 A 8 6 0 0 1 8 -21 L 8 -18 L -8 -18 Z" fill="#c0562e"/>
            <line x1="-6" y1="-2" x2="-12" y2="6" stroke="#3b4a63" stroke-width="3" stroke-linecap="round"/>
            <line x1="6" y1="-2" x2="12" y2="6" stroke="#3b4a63" stroke-width="3" stroke-linecap="round"/>
            <line x1="-3" y1="8" x2="-6" y2="16" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
            <line x1="3" y1="8" x2="6" y2="16" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
            <animateTransform id="bobAnim" attributeName="transform" type="translate" begin="indefinite" repeatCount="indefinite" dur="1.6s" values="0,0; 0,-3; 0,0"/>
          </g>
          <animateTransform id="climberAnim" attributeName="transform" type="translate" begin="indefinite" fill="freeze" dur="3s" calcMode="linear" keyTimes="0;0.2;0.4;0.6;0.8;1" values=""/>
        </g>
      </svg>
      <div class="legend-row">
        <span><span class="dot" style="background:#c0562e;"></span>Duras</span>
        <span><span class="dot" style="background:#3f6b57;"></span>Blandas</span>
      </div>

      <div class="profile-title" id="profileTitle"></div>
      <div class="profile-desc" id="profileDesc"></div>

      <div class="todo-box">
        <h4>A trabajar</h4>
        <ul id="profileTodo"></ul>
      </div>
    </div>
    <p class="screenshot-tip">📸 Sacale una captura a esta pantalla</p>
    <button class="reset-btn" id="resetBtn">Volver a completar</button>
  </div>

</div>

<script>
// ---------------------------------------------------------------
// Data: areas, in chart/hexagon order, with 5 levels each (0-4)
// ---------------------------------------------------------------
const AREAS = [
  {
    key: "operaciones",
    name: "Operaciones",
    shortLabel: "Operaciones",
    type: "duro",
    levels: [
      "Voy a donde me llaman, no tengo organización de tareas",
      "Tengo un cronograma/agenda de trabajo",
      "Tengo procesos o rutinas para las tareas repetitivas, aunque no estén escritos",
      "Tengo esos procesos documentados (pasos a seguir, checklist)",
      "Puedo escalar o tercerizar operaciones sin estar presente"
    ]
  },
  {
    key: "contabilidad",
    name: "Contabilidad",
    shortLabel: "Contabilidad",
    type: "duro",
    levels: [
      "No llevo ningún registro de ingresos/egresos",
      "Anoto ingresos y egresos de forma básica (cuaderno/planilla simple)",
      "Llevo un excel y sé cuánto necesito para cubrir gastos",
      "Calculo el costo y la rentabilidad de cada producto/servicio (sé cuánto gano por servicio)",
      "Tengo a alguien (contador/administrativo) que se encarga de esto"
    ]
  },
  {
    key: "presupuestos",
    name: "Presupuestos",
    shortLabel: "Presupuestos",
    type: "duro",
    levels: [
      "No armo ningún presupuesto",
      "Estimo gastos de manera informal/mental",
      "Tengo una planilla o herramienta de presupuesto",
      "Reviso y ajusto el presupuesto periódicamente",
      "Tengo a alguien que gestiona el presupuesto conmigo/por mí"
    ]
  },
  {
    key: "gestion",
    name: "Gestión de equipos",
    shortLabel: "Gestión de\nequipos",
    type: "blando",
    levels: [
      "Trabajo solo/a, no tengo equipo",
      "Tengo colaboradores ocasionales o tercerizados puntuales",
      "Tengo un equipo fijo pero sin roles definidos",
      "Tengo roles y responsabilidades definidas por persona",
      "Delego la conducción/liderazgo del equipo a otra persona"
    ]
  },
  {
    key: "comercial",
    name: "Comercial / Ventas",
    shortLabel: "Comercial /\nVentas",
    type: "blando",
    levels: [
      "No hago ninguna acción comercial, espero que me busquen",
      "Hago acciones puntuales (promociones, publicaciones ocasionales)",
      "Generé alianzas o acuerdos con otros negocios/marcas",
      "Tengo una estrategia de marketing definida (objetivos, público, calendario)",
      "Tengo una persona/equipo a cargo del área comercial"
    ]
  },
  {
    key: "comunicacion",
    name: "Comunicación / marca",
    shortLabel: "Comunicación /\nmarca",
    type: "blando",
    levels: [
      "No tengo marca definida (sin nombre/logo consistente) ni canales de contacto claros",
      "Tengo nombre y logo definidos, pero me comunico con los clientes solo por chat",
      "Tengo Instagram armado con identidad visual (logo, colores, fotos) además de WhatsApp",
      "Instagram + WhatsApp + uso un excel u otra herramienta para organizar contactos/ventas",
      "Tengo una persona a cargo de la comunicación de marca"
    ]
  }
];

const answers = {}; // key -> level (0-4)

// ---------------------------------------------------------------
// Render questions
// ---------------------------------------------------------------
const container = document.getElementById("questionsContainer");

AREAS.forEach(area => {
  const card = document.createElement("div");
  card.className = "question-card " + area.type;

  const tag = document.createElement("span");
  tag.className = "q-tag " + area.type;
  tag.textContent = area.type === "duro" ? "Habilidad dura" : "Habilidad blanda";
  card.appendChild(tag);

  const h3 = document.createElement("h3");
  h3.textContent = area.name;
  card.appendChild(h3);

  area.levels.forEach((desc, lvl) => {
    const opt = document.createElement("div");
    opt.className = "option";
    opt.dataset.area = area.key;
    opt.dataset.level = lvl;

    const bullet = document.createElement("div");
    bullet.className = "bullet";
    opt.appendChild(bullet);

    const text = document.createElement("div");
    text.textContent = desc;
    opt.appendChild(text);

    opt.addEventListener("click", () => selectOption(area.key, lvl, card));
    card.appendChild(opt);
  });

  container.appendChild(card);
});

function selectOption(areaKey, level, card) {
  answers[areaKey] = level;
  card.querySelectorAll(".option").forEach(o => {
    o.classList.toggle("selected", parseInt(o.dataset.level) === level);
  });
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(answers).length;
  document.getElementById("progressText").textContent = answered + " de 6 respondidas";
  document.getElementById("progressFill").style.width = (answered / AREAS.length * 100) + "%";
  document.getElementById("submitBtn").disabled = answered < AREAS.length;
}

// ---------------------------------------------------------------
// Profile logic
// ---------------------------------------------------------------
function getProfile(v) {
  const { operaciones, contabilidad, presupuestos, gestion, comercial, comunicacion } = v;
  const all = [operaciones, contabilidad, presupuestos, gestion, comercial, comunicacion];
  const avg = arr => arr.reduce((a,b)=>a+b,0) / arr.length;

  const avgAll = avg(all);
  const avgHard = avg([operaciones, contabilidad, presupuestos]);
  const avgSoftOut = avg([comercial, comunicacion]); // cara visible al cliente

  if (all.every(x => x <= 1)) {
    return {
      title: "Recién empezando",
      desc: "Está arrancando el negocio, todavía sin una base sólida en ninguna área.",
      todo: [
        "Llevar un registro básico de ingresos y egresos",
        "Tener un canal de contacto claro para los clientes (WhatsApp/Instagram)",
        "Armar un cronograma simple de trabajo"
      ]
    };
  }

  if (all.every(x => x >= 3)) {
    return {
      title: "Negocio consolidado",
      desc: "El negocio funciona parejo y bien en todas las áreas.",
      todo: [
        "Evaluar si conviene sumar gente o crecer",
        "Buscar nuevas oportunidades o servicios",
        "Mantener lo que ya funciona bien"
      ]
    };
  }

  if (gestion <= 1 && operaciones >= 3 && contabilidad >= 2) {
    return {
      title: "Solo con todo el peso",
      desc: "Tiene trabajo y lo hace bien, pero hace todo solo/a y no delega nada.",
      todo: [
        "Sumar un ayudante o tercerizar tareas puntuales",
        "Definir qué tareas puede soltar primero",
        "Documentar cómo hace las cosas para poder enseñarlas"
      ]
    };
  }

  if (avgHard >= 2.5 && avgSoftOut <= 1.5) {
    return {
      title: "Oficio fuerte, negocio flojo",
      desc: "Domina el trabajo y sabe cobrarlo, pero no sale a buscar clientes ni tiene una marca armada.",
      todo: [
        "Definir una marca simple (nombre, logo, Instagram)",
        "Buscar alianzas o acciones comerciales activas",
        "Sistematizar la comunicación con los clientes"
      ]
    };
  }

  if (avgSoftOut >= 2.5 && avg([contabilidad, presupuestos]) <= 1.5) {
    return {
      title: "Vende pero no controla los costos",
      desc: "Consigue trabajo y tiene buena llegada a los clientes, pero no sabe cuánto le queda de ganancia real.",
      todo: [
        "Calcular el costo real de cada trabajo",
        "Armar un presupuesto y revisarlo seguido",
        "Llevar un registro de ingresos y egresos"
      ]
    };
  }

  if (avgSoftOut >= 2.5 && avg([presupuestos, operaciones]) <= 1.5) {
    return {
      title: "Con trabajo, sin orden",
      desc: "Tiene buena demanda y clientes, pero no organiza el día a día ni el presupuesto.",
      todo: [
        "Armar un cronograma de trabajo",
        "Empezar a presupuestar cada trabajo",
        "Ordenar los procesos repetitivos"
      ]
    };
  }

  // fallback
  const sorted = Object.entries(v).sort((a,b) => a[1]-b[1]);
  const nameMap = {operaciones:"Operaciones", contabilidad:"Contabilidad", presupuestos:"Presupuestos", gestion:"Gestión de equipos", comercial:"Comercial/Ventas", comunicacion:"Comunicación/marca"};
  const lowest = sorted.slice(0,2).map(x => nameMap[x[0]]);
  return {
    title: "Perfil mixto",
    desc: "Tenés áreas bien resueltas y otras para trabajar, sin un patrón único.",
    todo: [
      `Priorizar: ${lowest[0]}`,
      `Después: ${lowest[1]}`,
      "Elegir una acción concreta para mejorar cada una este mes"
    ]
  };
}

// ---------------------------------------------------------------
// Submit / results
// ---------------------------------------------------------------
document.getElementById("submitBtn").addEventListener("click", () => {
  const name = document.getElementById("participantName").value.trim() || "Sin nombre";
  document.getElementById("resultName").textContent = name;

  const profile = getProfile(answers);
  document.getElementById("profileTitle").textContent = profile.title;
  document.getElementById("profileDesc").textContent = profile.desc;

  const todoList = document.getElementById("profileTodo");
  todoList.innerHTML = "";
  profile.todo.forEach(t => {
    const li = document.createElement("li");
    li.textContent = t;
    todoList.appendChild(li);
  });

  const values = AREAS.map(a => answers[a.key]);
  const labels = AREAS.map(a => a.name);

  buildMountainVisual();

  document.getElementById("quiz").style.display = "none";
  document.getElementById("results").style.display = "block";
  window.scrollTo(0,0);
});

// ---------------------------------------------------------------
// Montaña ilustrada: arma el sendero, las banderas y anima al
// escalador segun los niveles reales cargados en "answers"
// ---------------------------------------------------------------
function buildMountainVisual() {
  const marginX = 50;
  const width = 800;
  const baseY = 380;
  const topY = 100;
  const levelToY = (lvl) => baseY - (lvl * (baseY - topY)) / 4;
  const n = AREAS.length;
  const stepX = (width - marginX * 2) / (n - 1);
  const xFor = (i) => marginX + i * stepX;

  const points = AREAS.map((a, i) => ({
    x: xFor(i),
    y: levelToY(answers[a.key]),
    level: answers[a.key],
    type: a.type,
    label: a.shortLabel || a.name,
  }));

  // silueta + cresta
  const fillPoints = [`${marginX},${baseY}`, ...points.map(p => `${p.x},${p.y}`), `${width - marginX},${baseY}`].join(" ");
  document.getElementById("fillArea").setAttribute("points", fillPoints);
  const topPoints = points.map(p => `${p.x},${p.y}`).join(" ");
  document.getElementById("ridgeTop").setAttribute("points", topPoints);

  // sendero punteado que se "dibuja"
  const trailEl = document.getElementById("trail");
  trailEl.setAttribute("points", topPoints);
  let trailLength = 0;
  for (let i = 1; i < points.length; i++) {
    trailLength += Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
  }
  trailEl.setAttribute("stroke-dasharray", trailLength);
  const trailAnim = document.getElementById("trailAnim");
  trailAnim.setAttribute("from", trailLength);
  trailAnim.setAttribute("to", "0");

  // banderas por area (se reconstruyen cada vez, por si se vuelve a completar)
  const flagsG = document.getElementById("flags");
  flagsG.innerHTML = "";
  points.forEach(p => {
    const color = p.type === "duro" ? "#c0562e" : "#3f6b57";
    const ns = "http://www.w3.org/2000/svg";

    const pole = document.createElementNS(ns, "line");
    pole.setAttribute("x1", p.x); pole.setAttribute("x2", p.x);
    pole.setAttribute("y1", p.y); pole.setAttribute("y2", p.y - 34);
    pole.setAttribute("stroke", "#5a4632"); pole.setAttribute("stroke-width", "2.5");
    flagsG.appendChild(pole);

    const flag = document.createElementNS(ns, "path");
    flag.setAttribute("d", `M ${p.x} ${p.y - 34} l 22 6 l -22 6 z`);
    flag.setAttribute("fill", color);
    flagsG.appendChild(flag);

    const val = document.createElementNS(ns, "text");
    val.setAttribute("x", p.x + 9);
    val.setAttribute("y", p.y - 24);
    val.setAttribute("class", "level-value");
    val.textContent = p.level;
    flagsG.appendChild(val);

    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); dot.setAttribute("r", 5);
    dot.setAttribute("fill", color); dot.setAttribute("stroke", "#fff"); dot.setAttribute("stroke-width", "2");
    flagsG.appendChild(dot);
  });

  // etiquetas de area
  const labelsG = document.getElementById("areaLabels");
  labelsG.innerHTML = "";
  points.forEach(p => {
    const lines = p.label.split("\n");
    lines.forEach((line, li) => {
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", p.x);
      t.setAttribute("y", baseY + 26 + li * 16);
      t.setAttribute("class", "area-label");
      t.setAttribute("text-anchor", "middle");
      t.textContent = line;
      labelsG.appendChild(t);
    });
  });

  // escalador: recorre las 6 banderas y queda parado en la ultima, con rebote
  const climberValues = points.map(p => `${p.x},${p.y - 4}`).join(";");
  const climberAnim = document.getElementById("climberAnim");
  climberAnim.setAttribute("values", climberValues);

  const bobAnim = document.getElementById("bobAnim");

  // reiniciar animaciones (por si se completa el formulario mas de una vez)
  try {
    climberAnim.beginElement();
    trailAnim.beginElement();
    bobAnim.setAttribute("begin", "indefinite");
    setTimeout(() => { try { bobAnim.beginElement(); } catch (e) {} }, 3200);
  } catch (e) {
    // SMIL beginElement no soportado: el sendero y el escalador quedan
    // igual visibles en su posicion final, solo sin la animacion de entrada
  }
}

document.getElementById("resetBtn").addEventListener("click", () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  document.querySelectorAll(".option.selected").forEach(o => o.classList.remove("selected"));
  document.getElementById("participantName").value = "";
  updateProgress();
  document.getElementById("results").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  window.scrollTo(0,0);
});
</script>
